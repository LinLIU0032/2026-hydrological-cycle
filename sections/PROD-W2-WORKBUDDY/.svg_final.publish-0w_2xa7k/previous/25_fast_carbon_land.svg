    <text x="200" y="346" font-size="13" fill="#4A5568">Photosynthesis</text>
    <text x="200" y="368" font-size="13" fill="#1A2230">大气 CO₂ → 植物有机碳</text>

    <line x1="350" y1="474" x2="350" y2="294" stroke="#C2410C" stroke-width="5" />
    <polygon points="340,306 350,286 360,306" fill="#C2410C" />
    <text x="370" y="326" font-size="16" font-weight="bold" fill="#C2410C">呼吸作用</text>
    <text x="370" y="346" font-size="13" fill="#4A5568">Respiration</text>
    <text x="370" y="368" font-size="13" fill="#1A2230">有机碳 → 大气 CO₂</text>

    <line x1="718" y1="474" x2="718" y2="294" stroke="#C2410C" stroke-width="5" />
    <polygon points="708,306 718,286 728,306" fill="#C2410C" />
    <text x="738" y="326" font-size="16" font-weight="bold" fill="#C2410C">微生物分解</text>
    <text x="738" y="346" font-size="13" fill="#4A5568">Decomposition</text>
    <text x="738" y="368" font-size="13" fill="#1A2230">土壤碳 → 大气 CO₂</text>

    <rect x="64" y="482" width="414" height="144" rx="10" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" />
    <text x="88" y="514" font-size="16" font-weight="bold" fill="#0E3F8C">陆地植被 | Terrestrial vegetation</text>
    <rect x="88" y="530" width="120" height="26" rx="13" fill="#FDECDD" />
    <text x="148" y="548" font-size="13" text-anchor="middle" fill="#7A4A33">储库 Reservoir</text>
    <text fill="#1A2230" font-size="15" x="88" y="584">植物有机碳：光合固定的碳先进入</text><text fill="#1A2230" font-size="15" x="88" y="606">植被，再通过呼吸与枯落物离开。</text><rect x="566" y="482" width="306" height="144" rx="10" fill="#FDECDD" stroke="#F0CFC2" stroke-width="1" />
    <text x="590" y="514" font-size="16" font-weight="bold" fill="#7A4A33">土壤碳储库 | Soil carbon</text>
    <rect x="590" y="530" width="258" height="76" rx="6" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1" />
    <line x1="598" y1="555" x2="840" y2="555" stroke="#F0CFC2" stroke-width="1" />
    <line x1="598" y1="579" x2="840" y2="579" stroke="#F0CFC2" stroke-width="1" />
    <circle cx="620" cy="543" r="3" fill="#EA580C" />
    <circle cx="668" cy="543" r="3" fill="#EA580C" />
    <circle cx="716" cy="543" r="3" fill="#EA580C" />
    <circle cx="644" cy="567" r="3" fill="#EA580C" />
    <circle cx="740" cy="567" r="3" fill="#EA580C" />
    <circle cx="692" cy="591" r="3" fill="#EA580C" />
    <circle cx="788" cy="591" r="3" fill="#EA580C" />
    <circle cx="812" cy="567" r="3" fill="#EA580C" />
    <text x="590" y="622" font-size="13" fill="#4A5568">枯落物与死亡有机质在此积累</text>

    <line x1="488" y1="560" x2="550" y2="560" stroke="#7A4A33" stroke-width="3" />
    <polygon points="544,553 562,560 544,567" fill="#7A4A33" />
    <text x="522" y="540" font-size="13" text-anchor="middle" fill="#7A4A33">枯落物 | Litter</text>
  </g>

  <g id="why-fast" data-pptx-bounds="920 150 320 164">
    <rect x="920" y="150" width="320" height="164" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <text x="944" y="182" font-size="16" font-weight="bold" fill="#C2410C">为什么叫"快速" | Why "fast"</text>
    <text fill="#1A2230" font-size="15" x="944" y="214">植被与土壤里的碳以年—十年</text><text fill="#1A2230" font-size="15" x="944" y="236">尺度周转，不断被取用又归还。</text><rect x="944" y="264" width="272" height="34" rx="8" fill="#FDECDD" />
    <text x="1080" y="286" font-size="13" text-anchor="middle" fill="#7A4A33">年—十年 vs 地质储库的百万年</text>
  </g>

  <g id="soils-reservoir" data-pptx-bounds="920 330 320 164">
    <rect x="920" y="330" width="320" height="164" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" />
    <text x="944" y="362" font-size="16" font-weight="bold" fill="#0E3F8C">土壤是真实储库</text>
    <text fill="#1A2230" font-size="15" x="944" y="394">枯落物与死亡有机质在其中积累，</text><text fill="#1A2230" font-size="15" x="944" y="416">土壤因此成为一个独立的碳储库。</text><text x="944" y="450" font-size="13" fill="#4A5568">Reservoir, not a gap</text>
  </g>

  <g id="water-crossing" data-pptx-bounds="920 510 320 144">
    <rect x="920" y="510" width="320" height="144" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="944" y="542" font-size="16" font-weight="bold" fill="#0E3F8C">与水循环的交会</text>
    <text fill="#1A2230" font-size="15" x="944" y="574">同一片叶子上，光合固碳与蒸腾</text><text fill="#1A2230" font-size="15" x="944" y="596">失水同时发生；这是两个循环在</text><text fill="#1A2230" font-size="15" x="944" y="618">植物上的接触点（本页不展开）。</text><text x="944" y="640" font-size="13" fill="#4A5568">Photosynthesis · transpiration</text>
  </g>

