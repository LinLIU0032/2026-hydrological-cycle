<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C" />
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">2.5 快速碳循环：陆地生命 | Fast Carbon Cycle: Life on Land</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">CARBON CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C" />
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#C2410C">光合作用、呼吸与分解，把碳在大气、植被和土壤之间快速搬运</text>
  </g>

  <g id="land-loop-field" data-pptx-bounds="40 150 856 504">
    <rect x="40" y="150" width="856" height="504" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="64" y="184" font-size="16" font-weight="bold" fill="#0E3F8C">过程环 | The fast land loop</text>

    <rect x="64" y="200" width="808" height="76" rx="10" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <text x="88" y="228" font-size="13" font-weight="bold" fill="#C2410C">ATMOSPHERE · 大气</text>
    <text x="468" y="254" font-size="19" font-weight="bold" text-anchor="middle" fill="#C2410C">大气 CO₂ | Atmospheric CO₂</text>

    <line x1="180" y1="286" x2="180" y2="466" stroke="#EA580C" stroke-width="5" />
    <polygon points="170,454 180,474 190,454" fill="#EA580C" />
