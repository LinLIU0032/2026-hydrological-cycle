    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">CARBON CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C" />
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#C2410C">碳循环从快速的生物与海气交换，延伸到缓慢的岩石圈交换</text>
  </g>

  <g id="summary-1" data-pptx-bounds="40 150 584 236">
    <rect x="40" y="150" width="584" height="236" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <circle cx="76" cy="190" r="20" fill="#EA580C" />
    <text x="76" y="196" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="112" y="196" font-size="16" font-weight="bold" fill="#C2410C">碳存在哪里 | Where carbon resides</text>
    <text fill="#1A2230" font-size="15" x="64" y="246">大气、生命与土壤、海洋、沉积物</text><text fill="#1A2230" font-size="15" x="64" y="268">与岩石，共同构成碳的储库体系。</text><text x="64" y="326" font-size="13" fill="#4A5568">Atmosphere · life and soil · ocean · sediment · rock</text>
  </g>

  <g id="summary-2" data-pptx-bounds="656 150 584 236">
    <rect x="656" y="150" width="584" height="236" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <circle cx="692" cy="190" r="20" fill="#EA580C" />
    <text x="692" y="196" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="728" y="196" font-size="16" font-weight="bold" fill="#C2410C">快速通路 | Faster pathways</text>
    <text fill="#1A2230" font-size="15" x="680" y="246">光合作用、呼吸作用与海气交换，</text><text fill="#1A2230" font-size="15" x="680" y="268">把碳在大气与表层之间快速搬运。</text><text x="680" y="326" font-size="13" fill="#4A5568">Photosynthesis · respiration · air–sea exchange</text>
  </g>

  <g id="summary-3" data-pptx-bounds="40 418 584 236">
    <rect x="40" y="418" width="584" height="236" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <circle cx="76" cy="458" r="20" fill="#C2410C" />
    <text x="76" y="464" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="112" y="464" font-size="16" font-weight="bold" fill="#0E3F8C">与岩石相连 | Linked to rocks</text>
    <text fill="#1A2230" font-size="15" x="64" y="514">碳酸盐形成、埋藏、俯冲与脱气，</text><text fill="#1A2230" font-size="15" x="64" y="536">把表层碳一路接到岩石圈。</text><text x="64" y="594" font-size="13" fill="#4A5568">Carbonate formation · burial · subduction · degassing</text>
  </g>

  <g id="summary-4" data-pptx-bounds="656 418 584 236">
    <rect x="656" y="418" width="584" height="236" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
