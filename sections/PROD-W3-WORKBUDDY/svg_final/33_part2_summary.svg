    <text x="728" y="464" font-size="16" font-weight="bold" fill="#0E3F8C">不同的时钟 | Different clocks</text>
    <text fill="#1A2230" font-size="15" x="680" y="514">每条路径的速度不同，这决定每个</text><text fill="#1A2230" font-size="15" x="680" y="536">储库受到扰动后多快做出响应。</text><text x="680" y="594" font-size="13" fill="#4A5568">Response speed depends on the pathway</text>
  </g>

