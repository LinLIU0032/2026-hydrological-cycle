    <text x="720" y="182" font-size="16" font-weight="bold" fill="#C2410C">任务提示 | Prompt</text>
    <text x="720" y="212" font-size="15" fill="#1A2230">在图 12.19 上任选一条通路，说出：</text>

    <circle cx="740" cy="252" r="15" fill="#EA580C"/>
    <text x="740" y="257" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="768" y="248" font-size="15" fill="#1A2230">起点储库与终点储库</text>
    <text x="768" y="268" font-size="13" fill="#4A5568">Start and end reservoirs</text>

    <circle cx="740" cy="304" r="15" fill="#EA580C"/>
    <text x="740" y="309" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="768" y="300" font-size="15" fill="#1A2230">中间的过程或通量</text>
    <text x="768" y="320" font-size="13" fill="#4A5568">The process or flux</text>

    <circle cx="740" cy="356" r="15" fill="#EA580C"/>
    <text x="740" y="361" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="768" y="352" font-size="15" fill="#1A2230">这条通路是快还是慢</text>
    <text x="768" y="372" font-size="13" fill="#4A5568">Fast or slow</text>

    <circle cx="740" cy="408" r="15" fill="#EA580C"/>
    <text x="740" y="413" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="768" y="404" font-size="15" fill="#1A2230">属于生物、海洋还是地质路径</text>
    <text x="768" y="424" font-size="13" fill="#4A5568">Biological, oceanic, or geological</text>
  </g>

  <g id="reading-aid" data-pptx-bounds="696 484 544 170">
    <rect x="696" y="484" width="544" height="170" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/>
    <text x="720" y="516" font-size="16" font-weight="bold" fill="#0E3F8C">读图提示 | Reading aid</text>
    <text x="720" y="548" font-size="15" fill="#1A2230"><tspan x="720" dy="0">先找方框（储库），再读箭头（通量）：</tspan><tspan x="720" dy="22">大气、陆地、海洋与地质四区在图</tspan><tspan x="720" dy="22">上有明确分区，箭头还给方向。</tspan></text>
    <text x="720" y="624" font-size="13" fill="#4A5568">不要求背下图上全部数字。</text>
