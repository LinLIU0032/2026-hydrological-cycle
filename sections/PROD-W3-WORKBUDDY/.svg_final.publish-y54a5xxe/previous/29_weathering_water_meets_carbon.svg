<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C" />
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">2.9 风化：水循环开始影响碳循环 | Weathering: Where Water Meets Carbon</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">CARBON CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C" />
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#C2410C">水与 CO₂ 共同驱动风化；只有硅酸盐风化把大气碳长期转入岩石圈</text>
  </g>

  <g id="causal-chain" data-pptx-bounds="40 150 1200 210">
    <rect x="40" y="150" width="1200" height="210" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="64" y="182" font-size="16" font-weight="bold" fill="#0E3F8C">因果链 | Causal chain</text>

    <rect x="64" y="198" width="190" height="90" rx="10" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="80" y="238" font-size="16" font-weight="bold" fill="#1E4FA8">大气 CO₂</text>
    <text x="80" y="266" font-size="13" fill="#4A5568">+ 降水 Rainwater</text>

    <line x1="256" y1="243" x2="278" y2="243" stroke="#3D7BD9" stroke-width="4" />
    <polygon points="272,236 286,243 272,250" fill="#3D7BD9" />

    <rect x="296" y="198" width="190" height="90" rx="10" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="312" y="238" font-size="16" font-weight="bold" fill="#1E4FA8">弱碳酸</text>
    <text x="312" y="266" font-size="13" fill="#4A5568">H₂CO₃ · Carbonic acid</text>

    <line x1="488" y1="243" x2="510" y2="243" stroke="#7A4A33" stroke-width="4" />
    <polygon points="504,236 518,243 504,250" fill="#7A4A33" />

    <rect x="528" y="198" width="190" height="90" rx="10" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <text x="544" y="238" font-size="16" font-weight="bold" fill="#C2410C">岩石风化</text>
    <text x="544" y="266" font-size="13" fill="#4A5568">Chemical weathering</text>

    <line x1="720" y1="243" x2="742" y2="243" stroke="#7A4A33" stroke-width="4" />
    <polygon points="736,236 750,243 736,250" fill="#7A4A33" />

    <rect x="760" y="198" width="190" height="90" rx="10" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <text x="776" y="238" font-size="16" font-weight="bold" fill="#C2410C">溶解产物</text>
    <text x="776" y="266" font-size="13" fill="#4A5568">Dissolved products</text>

    <line x1="952" y1="243" x2="974" y2="243" stroke="#7A4A33" stroke-width="4" />
    <polygon points="968,236 982,243 968,250" fill="#7A4A33" />

    <rect x="992" y="198" width="190" height="90" rx="10" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <text x="1008" y="238" font-size="16" font-weight="bold" fill="#C2410C">河流输送</text>
    <text x="1008" y="266" font-size="13" fill="#4A5568">→ 海洋与沉积储存</text>

    <text x="64" y="322" font-size="13" fill="#4A5568">水的参与从降水开始：CO₂ 溶于雨水形成弱碳酸，这是水循环接入碳循环的入口。</text>
  </g>

  <g id="silicate-branch" data-pptx-bounds="40 376 584 278">
    <rect x="40" y="376" width="584" height="278" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1" />
    <text x="64" y="418" font-size="16" font-weight="bold" fill="#C2410C">硅酸盐风化 | Silicate weathering</text>
    <rect x="64" y="434" width="170" height="26" rx="13" fill="#EA580C" />
    <text x="149" y="452" font-size="13" text-anchor="middle" fill="#FFFFFF">长期净汇 Net sink</text>
    <text font-size="15" fill="#1A2230" x="64" y="492">CO₂ 溶于水后与硅酸盐矿物反应，</text><text font-size="15" fill="#1A2230" x="64" y="514">把大气中的碳转入岩石圈的碳酸</text><text font-size="15" fill="#1A2230" x="64" y="536">盐，并在很长的时间尺度上把它</text><text font-size="15" fill="#1A2230" x="64" y="558">留在这里，因此这是一个净的</text><text font-size="15" fill="#1A2230" x="64" y="580">大气碳去向。</text><rect x="64" y="596" width="536" height="42" rx="8" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1" />
    <text x="80" y="623" font-size="15" font-weight="bold" fill="#C2410C">特征简式：CaSiO₃ + CO₂ → CaCO₃ + SiO₂</text>
  </g>

  <g id="carbonate-branch" data-pptx-bounds="656 376 584 278">
    <rect x="656" y="376" width="584" height="278" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="680" y="418" font-size="16" font-weight="bold" fill="#0E3F8C">碳酸盐风化 | Carbonate weathering</text>
    <rect x="680" y="434" width="190" height="26" rx="13" fill="#D6DCE5" />
    <text x="775" y="452" font-size="13" text-anchor="middle" fill="#1A2230">循环 Recycling · 无净变化</text>
    <text font-size="15" fill="#1A2230" x="680" y="492">碳酸盐岩先被溶解，溶解出来的</text><text font-size="15" fill="#1A2230" x="680" y="514">碳随河流进入海洋，随后又在海</text><text font-size="15" fill="#1A2230" x="680" y="536">洋里重新形成碳酸盐沉积下来。</text><text font-size="15" fill="#1A2230" x="680" y="558">溶解与重新沉淀相抵，所以这一</text><text font-size="15" fill="#1A2230" x="680" y="580">支不带来净的大气碳变化。</text><rect x="680" y="596" width="536" height="42" rx="8" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" />
    <text x="696" y="623" font-size="15" font-weight="bold" fill="#0E3F8C">溶解与再沉淀相抵 | Dissolution ≈ re-precipitation</text>
  </g>

