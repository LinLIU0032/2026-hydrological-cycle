  <g id="sea-level-panel" data-pptx-bounds="760 154 480 246">
    <rect x="760" y="154" width="480" height="246" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
    <text x="780" y="186" font-size="16" font-weight="bold" fill="#0E3F8C">海平面效应 | Sea-level effect</text>
    <text x="780" y="220" font-size="15" fill="#1A2230">大陆冰积累、扩张 → 海平面下降</text>
    <text x="780" y="254" font-size="15" fill="#1A2230">大陆冰融化 → 海平面上升</text>
    <text x="780" y="288" font-size="15" fill="#1A2230">海冰漂浮于海面，融化不直接抬升海平面</text>
    <text x="780" y="320" font-size="13" fill="#4A5568">Floating sea-ice melt ≠ continental-ice melt</text>
    <text x="780" y="348" font-size="13" fill="#4A5568">Sea-level change tracks continental ice, not sea ice</text>
  </g>

  <g id="equivalent-panel" data-pptx-bounds="760 415 480 150">
