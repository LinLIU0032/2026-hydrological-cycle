    <text x="780" y="479" font-size="15" fill="#1A2230">南极冰盖 Antarctic ice sheet · 58.3 m<tspan x="780" dy="30">格陵兰冰盖 Greenland ice sheet · 7.36 m</tspan><tspan x="780" dy="30">冰川 Glaciers · 0.41 m</tspan></text>
  </g>

  <g id="climate-strip" data-pptx-bounds="760 580 480 54">
