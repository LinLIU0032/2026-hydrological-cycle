      <rect x="954" y="268" width="258" height="288" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>
      <circle cx="984" cy="300" r="16" fill="#1E4FA8"/>
      <text x="984" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
      <text x="1010" y="306" font-size="15" font-weight="bold" fill="#0E3F8C">降水</text>
      <text x="974" y="336" font-size="12" fill="#3D7BD9">Precipitation</text>
      <line x1="974" y1="348" x2="1192" y2="348" stroke="#D6DCE5" stroke-width="1"/>
      <text x="974" y="378" font-size="12.5" fill="#1A2230">云滴碰撞长大，</text>
      <text x="974" y="404" font-size="12.5" fill="#1A2230">以雨、雪等落回地表。</text>
      <ellipse cx="1030" cy="478" rx="22" ry="13" fill="#E8EFF8" stroke="#B8C7DC" stroke-width="1.5"/>
      <ellipse cx="1062" cy="471" rx="28" ry="16" fill="#E8EFF8" stroke="#B8C7DC" stroke-width="1.5"/>
      <ellipse cx="1096" cy="478" rx="21" ry="12" fill="#E8EFF8" stroke="#B8C7DC" stroke-width="1.5"/>
      <line x1="1030" y1="496" x2="1030" y2="522" stroke="#3D7BD9" stroke-width="3"/>
      <line x1="1064" y1="496" x2="1064" y2="522" stroke="#3D7BD9" stroke-width="3"/>
      <line x1="1098" y1="496" x2="1098" y2="522" stroke="#3D7BD9" stroke-width="3"/>
