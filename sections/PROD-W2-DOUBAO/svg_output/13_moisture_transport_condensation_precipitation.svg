    <g id="conclusion-strip" data-pptx-bounds="60 572 1158 48">
      <rect x="60" y="572" width="1158" height="48" rx="10" fill="#E8EFF8"/>
      <text x="639" y="602" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E3F8C">储量小不等于作用小：大气以约 9 天的快速周转，成为海陆之间最活跃的输水通道</text>
    </g>
