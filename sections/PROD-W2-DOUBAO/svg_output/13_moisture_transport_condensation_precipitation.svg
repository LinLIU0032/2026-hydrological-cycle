<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">1.10 水汽输送、凝结与降水 | Moisture Transport, Condensation &amp; Precipitation</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">WATER CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#1E4FA8"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#0E3F8C">大气是储量极小、周转极快的储库：蒸发—输送—凝结—降水构成快速回路</text>
  </g>

  <g id="pathway-field" data-pptx-bounds="40 150 1200 502">
    <rect x="40" y="150" width="1200" height="502" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>

    <g id="reservoir-stats" data-pptx-bounds="60 166 1158 78">
      <rect x="60" y="166" width="378" height="78" rx="10" fill="#F0F5FC"/>
      <text x="80" y="202" font-size="22" font-weight="bold" fill="#0E3F8C">12,900 km³</text>
      <text x="80" y="229" font-size="12.5" fill="#4A5568">大气水储量（约为海洋储量的十万分之一）</text>

      <rect x="450" y="166" width="378" height="78" rx="10" fill="#F0F5FC"/>
      <text x="470" y="202" font-size="22" font-weight="bold" fill="#0E3F8C">仅 9 天</text>
      <text x="470" y="229" font-size="12.5" fill="#4A5568">平均滞留时间，交换极快（CN 表 3-1）</text>

      <rect x="840" y="166" width="378" height="78" rx="10" fill="#F0F5FC"/>
      <text x="860" y="202" font-size="22" font-weight="bold" fill="#0E3F8C">≈ 2.5 cm</text>
      <text x="860" y="229" font-size="12.5" fill="#4A5568">若水汽一次性全部降下的等效水层厚度</text>
    </g>

    <g id="stage-evaporation" data-pptx-bounds="60 268 258 288">
      <rect x="60" y="268" width="258" height="288" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>
      <circle cx="90" cy="300" r="16" fill="#1E4FA8"/>
      <text x="90" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
      <text x="116" y="306" font-size="15" font-weight="bold" fill="#0E3F8C">蒸发</text>
      <text x="80" y="336" font-size="12" fill="#3D7BD9">Evaporation</text>
      <line x1="80" y1="348" x2="298" y2="348" stroke="#D6DCE5" stroke-width="1"/>
      <text x="80" y="378" font-size="12.5" fill="#1A2230">太阳加热海面与陆地，</text>
      <text x="80" y="404" font-size="12.5" fill="#1A2230">水变为水汽进入大气。</text>
      <path d="M92 512 C120 504 150 520 178 512 C206 504 232 518 250 512" fill="none" stroke="#3D7BD9" stroke-width="2"/>
      <line x1="120" y1="506" x2="120" y2="470" stroke="#1E4FA8" stroke-width="4"/>
      <polygon points="111,482 120,466 129,482" fill="#1E4FA8"/>
      <line x1="200" y1="506" x2="200" y2="470" stroke="#1E4FA8" stroke-width="4"/>
      <polygon points="191,482 200,466 209,482" fill="#1E4FA8"/>
    </g>

    <g id="stage-transport" data-pptx-bounds="358 268 258 288">
      <rect x="358" y="268" width="258" height="288" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>
      <circle cx="388" cy="300" r="16" fill="#1E4FA8"/>
      <text x="388" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
      <text x="414" y="306" font-size="15" font-weight="bold" fill="#0E3F8C">水汽输送</text>
      <text x="378" y="336" font-size="12" fill="#3D7BD9">Moisture transport</text>
      <line x1="378" y1="348" x2="596" y2="348" stroke="#D6DCE5" stroke-width="1"/>
      <text x="378" y="378" font-size="12.5" fill="#1A2230">大气运动把水汽从海洋</text>
      <text x="378" y="404" font-size="12.5" fill="#1A2230">上空输送到陆地上空。</text>
      <line x1="388" y1="486" x2="588" y2="486" stroke="#1E4FA8" stroke-width="4"/>
      <polygon points="572,476 592,486 572,496" fill="#1E4FA8"/>
      <line x1="388" y1="514" x2="588" y2="514" stroke="#3D7BD9" stroke-width="4"/>
      <polygon points="572,504 592,514 572,524" fill="#3D7BD9"/>
    </g>

