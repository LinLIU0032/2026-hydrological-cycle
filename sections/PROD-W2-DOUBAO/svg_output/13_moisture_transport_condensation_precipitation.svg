      <rect x="656" y="268" width="258" height="288" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>
      <circle cx="686" cy="300" r="16" fill="#1E4FA8"/>
      <text x="686" y="306" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
      <text x="712" y="306" font-size="15" font-weight="bold" fill="#0E3F8C">冷却凝结</text>
      <text x="676" y="336" font-size="12" fill="#3D7BD9">Cooling &amp; Condensation</text>
      <line x1="676" y1="348" x2="894" y2="348" stroke="#D6DCE5" stroke-width="1"/>
      <text x="676" y="378" font-size="12.5" fill="#1A2230">湿空气上升冷却，</text>
      <text x="676" y="404" font-size="12.5" fill="#1A2230">水汽凝结成微小云滴。</text>
      <ellipse cx="720" cy="505" rx="30" ry="17" fill="#E8EFF8" stroke="#B8C7DC" stroke-width="1.5"/>
      <ellipse cx="762" cy="495" rx="38" ry="22" fill="#E8EFF8" stroke="#B8C7DC" stroke-width="1.5"/>
      <ellipse cx="806" cy="505" rx="28" ry="16" fill="#E8EFF8" stroke="#B8C7DC" stroke-width="1.5"/>
    </g>

