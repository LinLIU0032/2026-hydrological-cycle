<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">1.12 地下水：慢一些的路径 | Groundwater: A Slower Pathway</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">WATER CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#1E4FA8"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#0E3F8C">补给、储存、排泄三步定义地下水：走得慢，但最终回到地表</text>
  </g>

  <g id="groundwater-field" data-pptx-bounds="40 150 1200 502">
    <rect x="40" y="150" width="1200" height="502" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>

    <g id="cross-section" data-pptx-bounds="60 166 1160 326">
      <rect x="60" y="166" width="1160" height="326" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>

      <rect x="72" y="180" width="1136" height="180" fill="#F7F9FC"/>
      <text x="88" y="206" font-size="12" fill="#4A5568">包气带 Unsaturated zone（未饱和）</text>

      <g id="recharge" data-pptx-bounds="110 212 120 140">
        <line x1="150" y1="214" x2="150" y2="346" stroke="#3D7BD9" stroke-width="3"/>
        <polygon points="143,334 150,350 157,334" fill="#3D7BD9"/>
        <line x1="190" y1="214" x2="190" y2="346" stroke="#3D7BD9" stroke-width="3"/>
        <polygon points="183,334 190,350 197,334" fill="#3D7BD9"/>
        <text x="110" y="252" font-size="12.5" font-weight="bold" fill="#1E4FA8">①补给 Recharge</text>
        <text x="110" y="274" font-size="11.5" fill="#4A5568">降水入渗，穿过包气带</text>
      </g>

      <g id="residence-plaque" data-pptx-bounds="880 196 300 92">
        <rect x="880" y="196" width="300" height="92" rx="10" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>
        <text x="900" y="222" font-size="11.5" font-weight="bold" fill="#0E3F8C">滞留时间 Residence time（CN 表 3-1）</text>
        <text x="900" y="248" font-size="12" fill="#1A2230">浅层地下水 100–200 年</text>
        <text x="900" y="272" font-size="12" fill="#1A2230">深层约 10,000 年（大气仅 9 天）</text>
      </g>

      <line x1="72" y1="360" x2="1208" y2="360" stroke="#3D7BD9" stroke-width="2" stroke-dasharray="10,6"/>
      <text x="88" y="352" font-size="12" font-weight="bold" fill="#1E4FA8">地下水位 Water Table</text>

      <rect x="72" y="362" width="1136" height="128" fill="#DCEAF8" stroke="#B8C7DC" stroke-width="1"/>
      <text x="88" y="392" font-size="13" font-weight="bold" fill="#0E3F8C">饱水带 Saturated zone　②储存 Storage：地下水在其中缓慢流动</text>

      <line x1="300" y1="448" x2="880" y2="448" stroke="#1E4FA8" stroke-width="3" stroke-dasharray="8,5"/>
      <polygon points="866,440 886,448 866,456" fill="#1E4FA8"/>
      <text x="590" y="436" font-size="11.5" text-anchor="middle" fill="#1E4FA8">缓慢地下流 Slow groundwater flow</text>

      <g id="discharge" data-pptx-bounds="930 328 262 140">
        <text x="930" y="328" font-size="12.5" font-weight="bold" fill="#1E4FA8">③排泄 Discharge</text>
        <line x1="950" y1="430" x2="950" y2="346" stroke="#1E4FA8" stroke-width="3"/>
        <polygon points="942,358 950,342 958,358" fill="#1E4FA8"/>
        <text x="966" y="402" font-size="11.5" fill="#1A2230">泉 / 河</text>
        <text x="966" y="420" font-size="10.5" fill="#4A5568">Spring · Stream</text>

        <line x1="1062" y1="430" x2="1062" y2="346" stroke="#1E4FA8" stroke-width="3"/>
        <polygon points="1054,358 1062,342 1070,358" fill="#1E4FA8"/>
        <text x="1078" y="412" font-size="11.5" fill="#1A2230">蒸发 ET</text>

        <line x1="1100" y1="464" x2="1186" y2="464" stroke="#1E4FA8" stroke-width="3"/>
        <polygon points="1174,456 1190,464 1174,472" fill="#1E4FA8"/>
        <text x="1143" y="454" font-size="11.5" text-anchor="middle" fill="#1A2230">海洋 Ocean</text>
      </g>
    </g>

    <g id="card-recharge" data-pptx-bounds="60 512 376 124">
      <rect x="60" y="512" width="376" height="124" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
      <text x="80" y="548" font-size="15" font-weight="bold" fill="#0E3F8C">① 补给 Recharge</text>
      <text x="80" y="582" font-size="12.5" fill="#1A2230">近期降水入渗，穿过包气带，</text>
      <text x="80" y="608" font-size="12.5" fill="#1A2230">到达地下水位，形成地下水。</text>
    </g>

    <g id="card-storage" data-pptx-bounds="451 512 376 124">
      <rect x="451" y="512" width="376" height="124" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
      <text x="471" y="548" font-size="15" font-weight="bold" fill="#0E3F8C">② 储存 Storage</text>
      <text x="471" y="582" font-size="12.5" fill="#1A2230">水在水位以下的饱水带中储存，</text>
      <text x="471" y="608" font-size="12.5" fill="#1A2230">并以极慢的速度流动。</text>
    </g>

    <g id="card-discharge" data-pptx-bounds="842 512 376 124">
      <rect x="842" y="512" width="376" height="124" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
      <text x="862" y="548" font-size="15" font-weight="bold" fill="#0E3F8C">③ 排泄 Discharge</text>
      <text x="862" y="582" font-size="12.5" fill="#1A2230">以泉、河、蒸发或海洋方式排出；</text>
      <text x="862" y="608" font-size="12.5" fill="#1A2230">长期补给≈排泄，维持水位稳定。</text>
    </g>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source: UE 8e pp.1675, 1682–1688, 1694–1695; 地球系统与演变 Ch.3 PDF pp.13–14; residence times CN Table 3-1 (W-04). Native cross-section.</text>
  <text id="page-number" data-pptx-role="page-number" x="1240" y="696" font-size="12" text-anchor="end" fill="#4A5568">15</text>
</svg>
