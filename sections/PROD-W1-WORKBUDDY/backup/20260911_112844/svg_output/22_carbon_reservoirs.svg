<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">2.2 碳储存在哪里？ | Carbon Reservoirs</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">CARBON CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#C2410C">碳主要储存在海洋、沉积物与岩石里；大气只是一个很小的储库</text>
  </g>

  <g id="carbon-reservoir-figure" data-pptx-bounds="40 150 690 504">
    <rect x="40" y="150" width="690" height="504" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
    <text x="68" y="184" font-size="16" font-weight="bold" fill="#0E3F8C">证据图 | 单一数据集</text>
    <image href="../images/C-01_UE_Fig12-19_PDF1209_raw.png" x="68" y="196" width="634" height="354" preserveAspectRatio="xMidYMin slice"/>
    <rect x="68" y="568" width="634" height="76" rx="10" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/>
    <text x="86" y="600" font-size="13" font-weight="bold" fill="#C2410C">本页数值单位：储库 Gt C（吉吨碳）</text>
    <text x="86" y="626" font-size="13" fill="#4A5568">四个较小储库的数值取自这张图；沉积物与岩石未给出总量，只作定性。</text>
  </g>

  <g id="reservoir-hierarchy" data-pptx-bounds="758 150 482 504">
    <rect x="758" y="150" width="482" height="504" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1"/>
    <text x="786" y="184" font-size="16" font-weight="bold" fill="#C2410C">碳储库层级 | Reservoir hierarchy</text>
    <text x="786" y="208" font-size="13" fill="#7A4A33">自小而大排序（本页整理）</text>

    <rect x="774" y="224" width="450" height="62" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="798" cy="255" r="16" fill="#EA580C"/>
    <text x="798" y="260" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="824" y="251" font-size="16" font-weight="bold" fill="#1A2230">大气 | Atmosphere</text>
    <text x="1206" y="251" font-size="15" font-weight="bold" text-anchor="end" fill="#C2410C">830 Gt C</text>
    <text x="824" y="274" font-size="13" fill="#4A5568">量级最小的储库</text>

    <rect x="774" y="294" width="450" height="62" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="798" cy="325" r="16" fill="#EA580C"/>
    <text x="798" y="330" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="824" y="321" font-size="16" font-weight="bold" fill="#1A2230">生物圈 | Biosphere</text>
    <text x="1206" y="321" font-size="15" font-weight="bold" text-anchor="end" fill="#C2410C">500 Gt C</text>
    <text x="824" y="344" font-size="13" fill="#4A5568">陆地植物与海洋生物</text>

    <rect x="774" y="364" width="450" height="62" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="798" cy="395" r="16" fill="#EA580C"/>
    <text x="798" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="824" y="391" font-size="16" font-weight="bold" fill="#1A2230">土壤 | Soils</text>
    <text x="1206" y="391" font-size="15" font-weight="bold" text-anchor="end" fill="#C2410C">1500 Gt C</text>
    <text x="824" y="414" font-size="13" fill="#4A5568">土壤中有机碳的储存空间</text>

    <rect x="774" y="434" width="450" height="62" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="798" cy="465" r="16" fill="#EA580C"/>
    <text x="798" y="470" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="824" y="461" font-size="16" font-weight="bold" fill="#1A2230">海洋 | Ocean</text>
    <text x="1206" y="461" font-size="15" font-weight="bold" text-anchor="end" fill="#C2410C">38,000 Gt C</text>
    <text x="824" y="484" font-size="13" fill="#4A5568">含海洋生物；表层库与深层库合计</text>

    <rect x="774" y="504" width="450" height="62" rx="10" fill="#FDECDD" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="798" cy="535" r="16" fill="#7A4A33"/>
    <text x="798" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">5</text>
    <text x="824" y="531" font-size="16" font-weight="bold" fill="#1A2230">沉积物 | Sediment</text>
    <text x="1206" y="531" font-size="15" font-weight="bold" text-anchor="end" fill="#7A4A33">图中未给出总量</text>
    <text x="824" y="554" font-size="13" fill="#4A5568">连接海洋与岩石的过渡储库</text>

    <rect x="774" y="574" width="450" height="62" rx="10" fill="#FDECDD" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="798" cy="605" r="16" fill="#7A4A33"/>
    <text x="798" y="610" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">6</text>
    <text x="824" y="601" font-size="16" font-weight="bold" fill="#1A2230">岩石圈 | Lithosphere</text>
    <text x="1206" y="601" font-size="15" font-weight="bold" text-anchor="end" fill="#7A4A33">图中未给出总量</text>
    <text x="824" y="624" font-size="13" fill="#4A5568">化石有机碳与碳酸盐岩</text>
  </g>

