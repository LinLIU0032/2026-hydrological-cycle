    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">2.1 为什么接下来讲碳？ | Why Carbon?</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">PART II · CARBON CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#C2410C">碳循环把气候、生命、海洋与岩石，接进与水循环同一套储库—通量框架</text>
  </g>

  <g id="course-position" data-pptx-bounds="40 150 590 504">
    <rect x="40" y="150" width="590" height="504" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
    <text x="68" y="190" font-size="16" font-weight="bold" fill="#0E3F8C">课程位置 | Course position</text>
    <text x="68" y="214" font-size="13" fill="#4A5568">第二部分现在开始；先用同一套语言读完水，再读碳。</text>

    <rect x="68" y="236" width="534" height="122" rx="12" fill="#F0F5FC"/>
    <circle cx="104" cy="297" r="22" fill="#1E4FA8"/>
    <text x="104" y="303" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="144" y="290" font-size="16" font-weight="bold" fill="#0E3F8C">水循环 | Water Cycle</text>
    <text x="144" y="322" font-size="15" fill="#1A2230">已完成 · 储库、通量与停留时间已建立</text>

    <rect x="68" y="374" width="534" height="122" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="104" cy="435" r="22" fill="#EA580C"/>
    <text x="104" y="441" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="144" y="428" font-size="16" font-weight="bold" fill="#C2410C">碳循环 | Carbon Cycle</text>
    <text x="144" y="460" font-size="15" fill="#1A2230">当前 · 用同一套语言读碳的储库与路径</text>
    <rect x="498" y="396" width="72" height="26" rx="8" fill="#EA580C"/>
    <text x="534" y="414" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">当前</text>

    <rect x="68" y="512" width="534" height="122" rx="12" fill="#F0F5FC"/>
    <circle cx="104" cy="573" r="22" fill="#3D7BD9"/>
    <text x="104" y="579" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="144" y="566" font-size="16" font-weight="bold" fill="#0E3F8C">耦合与气候反馈 | Coupling &amp; Feedbacks</text>
    <text x="144" y="598" font-size="15" fill="#1A2230">接下来 · 把两个循环放回同一个气候系统</text>
  </g>

