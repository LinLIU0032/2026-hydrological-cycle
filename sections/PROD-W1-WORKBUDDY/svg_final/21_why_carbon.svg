    <text x="771" y="256" font-size="13" text-anchor="middle" fill="#4A5568">Reservoir</text>

    <rect x="868" y="206" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <text x="953" y="234" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A2230">通量</text>
    <text x="953" y="256" font-size="13" text-anchor="middle" fill="#4A5568">Flux</text>

    <rect x="1050" y="206" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <text x="1135" y="234" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A2230">停留时间</text>
    <text x="1135" y="256" font-size="13" text-anchor="middle" fill="#4A5568">Residence Time</text>

    <text x="686" y="300" font-size="15" fill="#1A2230">碳再把它们连到四个领域：</text>

    <rect x="686" y="316" width="540" height="48" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="712" cy="340" r="6" fill="#EA580C"/>
    <text x="732" y="346" font-size="16" font-weight="bold" fill="#C2410C">气候 | Climate</text>
    <text x="1206" y="346" font-size="13" text-anchor="end" fill="#4A5568">连接温室效应与温度</text>

    <rect x="686" y="374" width="540" height="48" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="712" cy="398" r="6" fill="#EA580C"/>
    <text x="732" y="404" font-size="16" font-weight="bold" fill="#C2410C">生命 | Life</text>
    <text x="1206" y="404" font-size="13" text-anchor="end" fill="#4A5568">光合作用固定无机碳</text>

    <rect x="686" y="432" width="540" height="48" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="712" cy="456" r="6" fill="#EA580C"/>
    <text x="732" y="462" font-size="16" font-weight="bold" fill="#C2410C">海洋 | Ocean</text>
    <text x="1206" y="462" font-size="13" text-anchor="end" fill="#4A5568">溶解并输送碳</text>

    <rect x="686" y="490" width="540" height="48" rx="10" fill="#FFFFFF" stroke="#F0CFC2" stroke-width="1"/>
    <circle cx="712" cy="514" r="6" fill="#EA580C"/>
    <text x="732" y="520" font-size="16" font-weight="bold" fill="#C2410C">岩石 | Rocks</text>
    <text x="1206" y="520" font-size="13" text-anchor="end" fill="#4A5568">长期储碳并返回地表</text>

    <rect x="686" y="558" width="540" height="82" rx="12" fill="#FDECDD"/>
    <text x="712" y="588" font-size="16" font-weight="bold" fill="#C2410C">Carbon ≠ CO₂ only</text>
    <text x="712" y="618" font-size="15" fill="#7A4A33">碳循环不等于只看大气 CO₂。</text>
