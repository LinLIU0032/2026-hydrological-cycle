<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C" />
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">1.4 最大的水库并不是可用淡水 | Most Water Is Not Accessible Freshwater</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">WATER DISTRIBUTION</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 44">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#1E4FA8" />
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#0E3F8C">海洋占绝对多数，淡水很小，易利用的表层淡水更小</text>
  </g>

  <g id="water-hierarchy-chart" data-pptx-bounds="40 152 706 502">
    <rect x="40" y="152" width="706" height="502" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="64" y="186" font-size="16" font-weight="bold" fill="#0E3F8C">全球水的三级递减 | Three-level hierarchy of Earth's water</text>
    <g id="water-hierarchy-bars">
      
      <g id="level-all-water">
        <text x="64" y="224" font-size="15" font-weight="bold" fill="#1A2230">全部水 | All water<tspan font-size="13" font-weight="normal" fill="#4A5568"> ≈ 1.4×10^9 km³</tspan></text>
        <rect x="64" y="236" width="614.1" height="40" fill="#0E3F8C" />
        <rect x="678.1" y="236" width="25.9" height="40" fill="#9DB9E5" />
        <text x="666" y="261" font-size="13" font-weight="bold" text-anchor="end" fill="#FFFFFF">海洋 95.96% · 1.40×10^9 km³</text>
      </g>
      <g id="level-freshwater">
        <text x="64" y="330" font-size="15" font-weight="bold" fill="#1A2230">淡水储库 | Freshwater reservoirs<tspan font-size="13" font-weight="normal" fill="#4A5568"> 占全部水的比例</tspan></text>
        <rect x="64" y="342" width="19" height="40" fill="#1E4FA8" />
        <rect x="83" y="342" width="6.7" height="40" fill="#3D7BD9" />
        <rect x="89.7" y="342" width="4" height="40" fill="#9DB9E5" />
        <text x="104" y="356" font-size="13" fill="#1A2230">冰川 / 极地冰 2.97% · 4.34×10^7 km³</text>
        <text x="104" y="376" font-size="13" fill="#1A2230">地下水 1.05% · 1.54×10^7 km³ — 并非全部易利用</text>
        <text x="104" y="396" font-size="13" fill="#1A2230">湖泊 / 河流 0.009% · 1.27×10^5 km³</text>
      </g>
      <g id="level-accessible">
        <text x="64" y="452" font-size="15" font-weight="bold" fill="#1A2230">易利用的表层淡水 | Accessible surface freshwater<tspan font-size="13" font-weight="normal" fill="#4A5568"> 湖泊与河流</tspan></text>
        <rect x="64" y="464" width="4" height="40" fill="#9DB9E5" />
        <text x="84" y="489" font-size="13" fill="#1A2230">湖泊 / 河流 0.009% · 1.27×10^5 km³ — 占全部水极小份额</text>
      </g>
    </g>
    <text fill="#4A5568" font-size="12" x="64" y="560">注：三行条均按同一“占全部水”线性刻度绘制；极小段以最小可见条宽显示，数值以标签为准。</text><text fill="#4A5568" font-size="12" x="64" y="582">大气 0.001% 与生物圈 0.0001% 为另列的极小储库，未计入淡水行。</text></g>

  <g id="ocean-dominance-key" data-pptx-bounds="770 152 470 148">
    <rect x="770" y="152" width="470" height="148" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="794" y="184" font-size="16" font-weight="bold" fill="#0E3F8C">海洋占绝对多数 | Oceans dominate</text>
    <text x="794" y="230" font-size="28" font-weight="bold" fill="#1E4FA8">95.96% · 1.40×10^9 km³</text>
    <text x="794" y="262" font-size="13" fill="#4A5568">最大储库，但并非可直接利用的淡水来源</text>
  </g>

  <g id="freshwater-locked-key" data-pptx-bounds="770 312 470 158">
    <rect x="770" y="312" width="470" height="158" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="794" y="344" font-size="16" font-weight="bold" fill="#0E3F8C">淡水锁在冰与地下 | Freshwater locked away</text>
    <text x="794" y="378" font-size="15" fill="#1A2230">冰川 / 极地冰 2.97% · 4.34×10^7 km³</text>
    <text x="794" y="406" font-size="15" fill="#1A2230">地下水 1.05% · 1.54×10^7 km³</text>
    <text x="794" y="436" font-size="13" fill="#4A5568">地下水并非全部易利用；湖泊与河流仅 0.009%。</text>
  </g>

  <g id="accessible-tiny-key" data-pptx-bounds="770 482 470 172">
    <rect x="770" y="482" width="470" height="172" rx="12" fill="#F0F5FC" stroke="#B8C7DC" stroke-width="1" />
    <text x="794" y="514" font-size="16" font-weight="bold" fill="#0E3F8C">易利用的表层淡水极少</text>
    <text x="794" y="548" font-size="15" fill="#1A2230">湖泊 / 河流 0.009% · 1.27×10^5 km³</text>
    <text x="794" y="576" font-size="15" fill="#1A2230">大气 0.001% · 生物圈 0.0001%</text>
    <rect x="794" y="596" width="422" height="40" rx="10" fill="#DCEAF8" />
    <text x="1005" y="622" font-size="16" font-weight="bold" text-anchor="middle" fill="#0E3F8C">人类最易利用的水只占极小份额</text>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source: UE 8e, Ch.17, Fig. 17.1, PDF pp.1647–1649.</text>
  <text id="page-number" data-pptx-role="page-number" x="1240" y="696" font-size="12" text-anchor="end" fill="#4A5568">07</text>
</svg>