<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">1.7 海洋与陆地的水量收支 | Ocean–Land Water Budget</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">WATER CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#1E4FA8"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#0E3F8C">海洋多出的蒸发量经大气输送到陆地，再由等量径流回到海洋</text>
  </g>

  <g id="budget-field" data-pptx-bounds="40 150 1200 502">
    <rect x="40" y="150" width="1200" height="502" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>

    <g id="atmosphere-band" data-pptx-bounds="60 166 1160 66">
      <rect x="60" y="166" width="1160" height="66" rx="10" fill="#E8EFF8"/>
      <text x="80" y="194" font-size="13" font-weight="bold" fill="#1E4FA8">ATMOSPHERE · 大气</text>
      <text x="1200" y="194" font-size="12" text-anchor="end" fill="#4A5568">单位 Unit：×10³ km³/yr（教材全球收支）</text>
      <line x1="1150" y1="214" x2="340" y2="214" stroke="#1E4FA8" stroke-width="5"/>
      <polygon points="356,203 336,214 356,225" fill="#1E4FA8"/>
      <rect x="368" y="190" width="532" height="26" rx="13" fill="#FFFFFF"/>
      <text x="634" y="209" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E3F8C">大气向陆净输送 Atmospheric transport = 36（海洋 → 陆地）</text>
    </g>

    <g id="land-panel" data-pptx-bounds="60 250 520 298">
      <rect x="60" y="250" width="520" height="298" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1.5"/>
      <text x="84" y="284" font-size="15" font-weight="bold" fill="#0E3F8C">LAND · 陆地</text>
      <text x="556" y="284" font-size="12" text-anchor="end" fill="#4A5568">降水 &gt; 蒸散</text>

      <line x1="200" y1="316" x2="200" y2="402" stroke="#3D7BD9" stroke-width="6"/>
      <polygon points="188,388 200,406 212,388" fill="#3D7BD9"/>
      <text x="200" y="309" font-size="12.5" text-anchor="middle" fill="#4A5568">降水向下 Precip. ↓</text>
      <text x="200" y="442" font-size="27" font-weight="bold" text-anchor="middle" fill="#1E4FA8">107</text>
      <text x="200" y="464" font-size="12" text-anchor="middle" fill="#4A5568">降水 Precipitation</text>

      <line x1="430" y1="402" x2="430" y2="316" stroke="#1E4FA8" stroke-width="6"/>
      <polygon points="418,330 430,312 442,330" fill="#1E4FA8"/>
      <text x="430" y="309" font-size="12.5" text-anchor="middle" fill="#4A5568">蒸散向上 ET ↑</text>
      <text x="430" y="442" font-size="27" font-weight="bold" text-anchor="middle" fill="#3D7BD9">71</text>
      <text x="430" y="464" font-size="12" text-anchor="middle" fill="#4A5568">蒸散 Evapotranspiration</text>

      <rect x="84" y="478" width="472" height="52" rx="10" fill="#F0F5FC"/>
      <text x="320" y="511" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E3F8C">陆地收支：107 − 71 = 36（净得水 → 径流）</text>
    </g>

    <g id="ocean-panel" data-pptx-bounds="700 250 520 298">
      <rect x="700" y="250" width="520" height="298" rx="12" fill="#F0F5FC" stroke="#B8C7DC" stroke-width="1.5"/>
      <text x="724" y="284" font-size="15" font-weight="bold" fill="#0E3F8C">OCEAN · 海洋</text>
      <text x="1196" y="284" font-size="12" text-anchor="end" fill="#4A5568">蒸发 &gt; 降水</text>

      <line x1="840" y1="402" x2="840" y2="316" stroke="#1E4FA8" stroke-width="6"/>
      <polygon points="828,330 840,312 852,330" fill="#1E4FA8"/>
      <text x="840" y="309" font-size="12.5" text-anchor="middle" fill="#4A5568">蒸发向上 Evap. ↑</text>
      <text x="840" y="442" font-size="27" font-weight="bold" text-anchor="middle" fill="#1E4FA8">434</text>
      <text x="840" y="464" font-size="12" text-anchor="middle" fill="#4A5568">蒸发 Evaporation</text>

      <line x1="1080" y1="316" x2="1080" y2="402" stroke="#3D7BD9" stroke-width="6"/>
      <polygon points="1068,388 1080,406 1092,388" fill="#3D7BD9"/>
      <text x="1080" y="309" font-size="12.5" text-anchor="middle" fill="#4A5568">降水向下 Precip. ↓</text>
      <text x="1080" y="442" font-size="27" font-weight="bold" text-anchor="middle" fill="#3D7BD9">398</text>
      <text x="1080" y="464" font-size="12" text-anchor="middle" fill="#4A5568">降水 Precipitation</text>

      <rect x="724" y="478" width="472" height="52" rx="10" fill="#FFFFFF"/>
      <text x="960" y="511" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E3F8C">海洋收支：434 − 398 = 36（净失水 → 大气）</text>
    </g>

    <g id="runoff-return" data-pptx-bounds="180 556 920 76">
      <text x="640" y="578" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E3F8C">径流 Runoff = 36：陆地把等量的水送回海洋（陆地 → 海洋）</text>
      <line x1="200" y1="598" x2="1080" y2="598" stroke="#0E3F8C" stroke-width="6"/>
      <polygon points="1062,586 1086,598 1062,610" fill="#0E3F8C"/>
      <text x="640" y="630" font-size="13" text-anchor="middle" fill="#4A5568">全球收支闭合：海洋 E−P = 陆地 P−E = 大气输送 = 径流 = 36</text>
    </g>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source: UE 8e, Fig. 17.2, PDF pp.1652, 1655. Flows ×10³ km³/yr; one internally coherent textbook global budget.</text>
  <text id="page-number" data-pptx-role="page-number" x="1240" y="696" font-size="12" text-anchor="end" fill="#4A5568">10</text>
</svg>
