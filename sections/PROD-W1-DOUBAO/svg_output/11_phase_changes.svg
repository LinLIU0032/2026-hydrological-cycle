<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">1.8 水的三相转换 | Phase Changes of Water</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">WATER CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#1E4FA8"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#0E3F8C">相变同时转移水和能量：向上吸热、向下放热，汽化潜热约为熔融的 7 倍</text>
  </g>

  <g id="phase-figure" data-pptx-bounds="40 150 744 470">
    <rect x="40" y="150" width="744" height="470" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
    <image href="../images/W-05_Fig3-17_PDF27_print112_raw.png" x="50" y="182" width="724" height="406" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="three-states" data-pptx-bounds="804 150 436 140">
    <rect x="804" y="150" width="436" height="140" rx="12" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1"/>
    <text x="824" y="182" font-size="15" font-weight="bold" fill="#0E3F8C">三态 | Three states</text>
    <text x="824" y="214" font-size="13.5" fill="#1A2230">固态 Solid — 冰 Ice</text>
    <text x="824" y="242" font-size="13.5" fill="#1A2230">液态 Liquid — 水 Water（0–100 °C）</text>
    <text x="824" y="270" font-size="13.5" fill="#1A2230">气态 Gas — 水汽 Vapor</text>
  </g>

  <g id="heat-absorbed" data-pptx-bounds="804 304 436 152">
    <rect x="804" y="304" width="436" height="152" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/>
    <text x="824" y="336" font-size="15" font-weight="bold" fill="#1E4FA8">吸热：能量进入水 | Heat absorbed</text>
    <text x="824" y="368" font-size="13" fill="#1A2230">熔融 Melting　+80 Cal（0 °C）</text>
    <text x="824" y="396" font-size="13" fill="#1A2230">增温 Warming　+100 Cal（0→100 °C）</text>
    <text x="824" y="424" font-size="13" fill="#1A2230">蒸发 Vaporization　+540 Cal（100 °C）</text>
  </g>

  <g id="heat-released" data-pptx-bounds="804 470 436 150">
    <rect x="804" y="470" width="436" height="150" rx="12" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1"/>
    <text x="824" y="502" font-size="15" font-weight="bold" fill="#3D7BD9">放热：能量离开水 | Heat released</text>
    <text x="824" y="534" font-size="13" fill="#1A2230">冻结 Freezing　−80 Cal</text>
    <text x="824" y="562" font-size="13" fill="#1A2230">降温 Cooling　−100 Cal</text>
    <text x="824" y="590" font-size="13" fill="#1A2230">凝结 Condensation　−540 Cal</text>
  </g>

  <g id="latent-heat-strip" data-pptx-bounds="40 628 1200 44">
    <rect x="40" y="628" width="1200" height="44" rx="10" fill="#E8EFF8"/>
    <text x="640" y="656" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#0E3F8C">熔融潜热 Latent heat of fusion 80 Cal　｜　汽化潜热 Latent heat of vaporization 540 Cal（约 7 倍）　｜　1 Cal = 4.184 J</text>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source: 地球系统与演变, Fig. 3-17, p.112 (PDF p.27). Figure W-05 shown intact; arrow directions and all values preserved.</text>
