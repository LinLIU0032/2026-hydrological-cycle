  <g id="definition-strip" data-pptx-bounds="40 612 1200 44">
    <rect x="40" y="612" width="1200" height="44" rx="10" fill="#F0F5FC" stroke="#1E4FA8" stroke-width="1"/>
    <text x="640" y="640" font-size="15" font-weight="bold" text-anchor="middle" fill="#0E3F8C">Evapotranspiration 蒸散 = Evaporation 蒸发（海洋 + 陆地表面） + Transpiration 蒸腾（植被）</text>
