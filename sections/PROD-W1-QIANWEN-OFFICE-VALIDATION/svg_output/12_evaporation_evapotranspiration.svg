  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source: 地球系统与演变, Ch.4 §4.3.5, PDF pp.73–74; UE 8e, Ch.17 PDF pp.1653–1654 &amp; Ch.12 p.1168. Native process diagram.</text>
