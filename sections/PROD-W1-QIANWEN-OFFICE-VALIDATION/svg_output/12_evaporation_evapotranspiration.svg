    <line x1="640" y1="380" x2="640" y2="262" stroke="#1E4FA8" stroke-width="6"/>
    <polygon points="628,274 652,274 640,252" fill="#1E4FA8"/>
    <rect x="570" y="300" width="140" height="32" rx="8" fill="#FFFFFF" stroke="#1E4FA8" stroke-width="1"/>
