<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">1.3 地球的水在哪里？ | Where Is Earth's Water?</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">WATER CYCLE</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 44">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#1E4FA8"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#0E3F8C">地球上的水高度不均匀分布：海洋占绝大多数，易利用的表层淡水极少</text>
  </g>

  <g id="distribution-chart" data-pptx-bounds="40 154 760 440">
    <rect x="40" y="154" width="760" height="440" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
    <text x="66" y="186" font-size="15" font-weight="bold" fill="#0E3F8C">全球水储库分布 | Global water reservoirs</text>
    <text x="66" y="208" font-size="12" fill="#4A5568">条长按 log₁₀(体积 km³) 绘制 · 数据：UE Fig. 17.1</text>

    <g id="row-ocean" data-pptx-bounds="66 224 708 52">
      <text x="66" y="244" font-size="14" font-weight="bold" fill="#1A2230">海洋 Ocean / seas</text>
      <text x="66" y="264" font-size="12" fill="#4A5568">95.96% · 1.40×10⁹ km³</text>
      <rect x="260" y="234" width="416" height="26" rx="4" fill="#1E4FA8"/>
    </g>

    <g id="row-glacier" data-pptx-bounds="66 284 708 52">
      <text x="66" y="304" font-size="14" font-weight="bold" fill="#1A2230">冰川/极地冰 Glacier &amp; polar ice</text>
      <text x="66" y="324" font-size="12" fill="#4A5568">2.97% · 4.34×10⁷ km³</text>
      <rect x="260" y="294" width="314" height="26" rx="4" fill="#3D7BD9"/>
    </g>

    <g id="row-groundwater" data-pptx-bounds="66 344 708 52">
      <text x="66" y="364" font-size="14" font-weight="bold" fill="#1A2230">地下水 Groundwater</text>
      <text x="66" y="384" font-size="12" fill="#4A5568">1.05% · 1.54×10⁷ km³</text>
      <rect x="260" y="354" width="284" height="26" rx="4" fill="#3D7BD9"/>
    </g>

    <g id="row-lakes" data-pptx-bounds="66 404 708 52">
      <text x="66" y="424" font-size="14" font-weight="bold" fill="#1A2230">湖泊/河流 Lakes &amp; rivers</text>
      <text x="66" y="444" font-size="12" fill="#4A5568">0.009% · 1.27×10⁵ km³</text>
      <rect x="260" y="414" width="143" height="26" rx="4" fill="#6FA3E8"/>
    </g>

    <g id="row-atmosphere" data-pptx-bounds="66 464 708 52">
      <text x="66" y="484" font-size="14" font-weight="bold" fill="#1A2230">大气 Atmosphere</text>
      <text x="66" y="504" font-size="12" fill="#4A5568">0.001% · 1.5×10⁴ km³</text>
      <rect x="260" y="474" width="80" height="26" rx="4" fill="#6FA3E8"/>
    </g>

    <g id="row-biosphere" data-pptx-bounds="66 524 708 52">
      <text x="66" y="544" font-size="14" font-weight="bold" fill="#1A2230">生物圈 Biosphere</text>
      <text x="66" y="564" font-size="12" fill="#4A5568">0.0001% · 2×10³ km³</text>
      <rect x="260" y="534" width="20" height="26" rx="4" fill="#6FA3E8"/>
    </g>
  </g>

  <g id="dominance-panel" data-pptx-bounds="820 154 420 210">
    <rect x="820" y="154" width="420" height="210" rx="12" fill="#F0F5FC" stroke="#1E4FA8" stroke-width="2"/>
    <text x="846" y="190" font-size="15" font-weight="bold" fill="#0E3F8C">海洋占绝对多数</text>
    <text x="846" y="252" font-size="56" font-weight="bold" fill="#1E4FA8">95.96%</text>
    <text x="846" y="284" font-size="14" fill="#4A5568">of all Earth's water is in oceans / seas</text>
    <line x1="846" y1="304" x2="1214" y2="304" stroke="#B8C7DC" stroke-width="1"/>
    <text x="846" y="332" font-size="14" fill="#1A2230">其余全部储库合计仅 <tspan font-weight="bold" fill="#1E4FA8">4.04%</tspan></text>
  </g>

  <g id="freshwater-panel" data-pptx-bounds="820 384 420 210">
    <rect x="820" y="384" width="420" height="210" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="1"/>
    <text x="846" y="420" font-size="15" font-weight="bold" fill="#C2410C">易利用的表层淡水更少</text>
    <text x="846" y="456" font-size="14" fill="#1A2230">
      <tspan x="846" dy="0">冰川/极地冰 2.97% 大多难以直接利用；</tspan>
      <tspan x="846" dy="24">湖泊与河流合计仅 0.009%，</tspan>
      <tspan x="846" dy="24">大气水 0.001%，生物圈水 0.0001%。</tspan>
    </text>
    <rect x="846" y="540" width="368" height="34" rx="10" fill="#FDECDD"/>
    <text x="1030" y="562" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2410C">"水很多" ≠ "可用的淡水很多"</text>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source: UE 8e, Ch.17, Fig. 17.1, PDF pp.1647–1649. W-01 (CN Fig. 3-3) is approved backup only; datasets are not mixed.</text>
  <text id="page-number" data-pptx-role="page-number" x="1240" y="696" font-size="12" text-anchor="end" fill="#4A5568">06</text>
</svg>
