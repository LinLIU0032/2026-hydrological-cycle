  <g id="closure-reading" data-pptx-bounds="40 546 1200 66" font-size="13">
    <text x="40" y="560" fill="#1A2230">闭环判断：冰雪与反照率下降带来的吸收增加继续加强增温，因此是正反馈。 The loop amplifies the initial warming → positive.</text>
    <text x="40" y="600" fill="#4A5568">判断步骤：找初始变化 → 跟踪诱发变化 → 比较最终作用方向 Steps: initial change → induced change → compare final direction</text>
  </g>

