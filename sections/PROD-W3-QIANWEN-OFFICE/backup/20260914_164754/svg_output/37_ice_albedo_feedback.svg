    <text x="640" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#1E4FA8">诱发变化与初始变化同向 → 沿原方向放大 Induced change reinforces the initial change</text>

    <rect x="64" y="430" width="520" height="70" rx="12" fill="#1E4FA8" />
    <circle cx="100" cy="465" r="16" fill="#FFFFFF" />
    <text x="100" y="472" font-size="20" font-weight="bold" text-anchor="middle" fill="#1E4FA8">+</text>
    <text x="128" y="458" font-size="16" font-weight="bold" fill="#FFFFFF">Positive Feedback 正反馈</text>
    <text x="128" y="482" font-size="12" fill="#D6E4F7">诱发变化加强初始增温 Induced change amplifies warming</text>

    <rect x="604" y="430" width="612" height="70" rx="12" fill="#F0F5FC" stroke="#D6DCE5" stroke-width="1" />
    <text x="620" y="458" font-size="13" fill="#1A2230">反照率 Albedo = 地表反射率 surface reflectivity</text>
    <text x="620" y="482" font-size="12" fill="#4A5568">No ice-volume, sea-level, or Snowball-Earth claims on this page</text>
