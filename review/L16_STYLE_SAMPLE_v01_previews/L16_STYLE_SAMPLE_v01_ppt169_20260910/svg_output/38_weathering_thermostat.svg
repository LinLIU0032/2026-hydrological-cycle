<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">3.4 岩石风化恒温器 | The Weathering Thermostat</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">SLOW NEGATIVE FEEDBACK</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 850 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#1A2230">更暖、更湿和更酸性 → 硅酸盐风化加速 → CO₂ 去除 → 抑制初始增温</text>
  </g>

  <g id="timescale" data-pptx-bounds="914 92 326 42">
    <rect x="914" y="92" width="326" height="42" rx="12" fill="#FDECDD" stroke="#F0CFC2"/>
    <text x="1077" y="120" font-size="15" font-weight="bold" text-anchor="middle" fill="#C2410C">响应时间  &gt;10^5–10^7 years</text>
  </g>

  <g id="feedback-field" data-pptx-bounds="40 154 1200 440">
    <rect x="40" y="154" width="1200" height="440" rx="12" fill="#F7F9FC" stroke="#D6DCE5"/>

    <g id="step-1" data-pptx-bounds="78 194 250 112">
      <rect x="78" y="194" width="250" height="112" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="2"/>
      <circle cx="108" cy="224" r="18" fill="#EA580C"/>
      <text x="108" y="230" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">1</text>
      <text x="140" y="220" font-size="16" font-weight="bold" fill="#C2410C">初始扰动</text>
      <text x="140" y="245" font-size="13" fill="#7A4A33">Initial perturbation</text>
      <text x="98" y="278" font-size="15" font-weight="bold" fill="#1A2230">大气 CO₂ ↑ / 温度 ↑</text>
    </g>

    <g id="step-2" data-pptx-bounds="376 194 250 112">
      <rect x="376" y="194" width="250" height="112" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="2"/>
      <circle cx="406" cy="224" r="18" fill="#EA580C"/>
      <text x="406" y="230" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2</text>
      <text x="438" y="220" font-size="16" font-weight="bold" fill="#C2410C">风化条件增强</text>
      <text x="438" y="245" font-size="13" fill="#4A5568">Weathering conditions</text>
      <text x="396" y="278" font-size="15" fill="#1A2230">更暖 · 更湿 · 雨水酸性更强</text>
    </g>

    <g id="step-3" data-pptx-bounds="674 194 250 112">
      <rect x="674" y="194" width="250" height="112" rx="12" fill="#F0F5FC" stroke="#B8C7DC" stroke-width="2"/>
      <circle cx="704" cy="224" r="18" fill="#1E4FA8"/>
      <text x="704" y="230" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">3</text>
      <text x="736" y="220" font-size="16" font-weight="bold" fill="#0E3F8C">硅酸盐风化加速</text>
      <text x="736" y="245" font-size="13" fill="#4A5568">Faster silicate weathering</text>
      <text x="694" y="278" font-size="15" fill="#1A2230">消耗 CO₂，释放溶解产物</text>
    </g>

    <g id="step-4" data-pptx-bounds="972 194 230 112">
      <rect x="972" y="194" width="230" height="112" rx="12" fill="#F0F5FC" stroke="#B8C7DC" stroke-width="2"/>
      <circle cx="1002" cy="224" r="18" fill="#1E4FA8"/>
      <text x="1002" y="230" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">4</text>
      <text x="1034" y="220" font-size="16" font-weight="bold" fill="#0E3F8C">海洋输送与埋藏</text>
      <text x="1034" y="245" font-size="13" fill="#4A5568">Ocean transfer &amp; burial</text>
      <text x="992" y="278" font-size="15" fill="#1A2230">Ca²⁺ 通量 ↑ · CaCO₃ 埋藏</text>
    </g>

    <line x1="328" y1="250" x2="366" y2="250" stroke="#EA580C" stroke-width="5"/>
    <polygon points="354,239 373,250 354,261" fill="#EA580C"/>
    <line x1="626" y1="250" x2="664" y2="250" stroke="#EA580C" stroke-width="5"/>
    <polygon points="652,239 671,250 652,261" fill="#EA580C"/>
    <line x1="924" y1="250" x2="962" y2="250" stroke="#1E4FA8" stroke-width="5"/>
    <polygon points="950,239 969,250 950,261" fill="#1E4FA8"/>

    <g id="result" data-pptx-bounds="692 380 438 112">
      <rect x="692" y="380" width="438" height="112" rx="12" fill="#0E3F8C"/>
      <circle cx="730" cy="417" r="23" fill="#FFFFFF"/>
      <text x="730" y="425" font-size="28" font-weight="bold" text-anchor="middle" fill="#0E3F8C">−</text>
      <text x="768" y="410" font-size="19" font-weight="bold" fill="#FFFFFF">大气 CO₂ ↓ · 冷却趋势</text>
      <text x="768" y="439" font-size="15" fill="#C7D7F2">CO₂ removal and carbonate burial</text>
      <text x="768" y="468" font-size="15" font-weight="bold" fill="#FFFFFF">最终作用反对初始增温 → 负反馈</text>
    </g>
    <path d="M1087 306 L1087 350 C1087 365 1067 365 1054 365 L910 365 C900 365 888 370 888 380" fill="none" stroke="#1E4FA8" stroke-width="5"/>
    <polygon points="877,368 888,387 899,368" fill="#1E4FA8"/>

    <g id="cooling-return" data-pptx-bounds="142 380 480 152">
      <rect x="142" y="380" width="480" height="152" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="2"/>
      <text x="170" y="414" font-size="16" font-weight="bold" fill="#0E3F8C">反向半环 | Cooling return</text>
      <text x="170" y="446" font-size="15" fill="#1A2230">冷却 → 水汽与酸性减弱 → 风化变慢 → CO₂ 去除减弱</text>
      <line x1="170" y1="470" x2="594" y2="470" stroke="#B8C7DC" stroke-width="3"/>
      <polygon points="582,459 601,470 582,481" fill="#B8C7DC"/>
      <text x="170" y="510" font-size="13" fill="#4A5568">火山 CO₂ 输入可逐渐重建大气碳储库</text>
    </g>

    <path d="M692 436 C646 436 646 554 594 554 L186 554 C118 554 86 512 86 444 L86 322 C86 314 92 310 102 306" fill="none" stroke="#0E3F8C" stroke-width="4"/>
    <polygon points="89,300 109,304 95,319" fill="#0E3F8C"/>

    <rect x="716" y="516" width="414" height="50" rx="10" fill="#FDECDD" stroke="#F0CFC2"/>
    <text x="923" y="547" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2410C">限定：碳酸盐岩风化 ≠ 同等的净大气 CO₂ 汇</text>
  </g>

  <g id="loop-caption" data-pptx-bounds="40 612 1200 44">
    <text x="40" y="640" font-size="15" font-weight="bold" fill="#1A2230">闭环判断：</text>
    <text x="136" y="640" font-size="15" fill="#4A5568">初始增温引起的变化最终带来冷却趋势，因此这是缓慢的负反馈。</text>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source/redraw basis: HB Ch.9, Fig. 9-11 (F-01), pp.246–249; UE 8e Ch.12 companion.</text>
  <text id="page-number" data-pptx-role="page-number" x="1240" y="696" font-size="12" text-anchor="end" fill="#4A5568">38</text>
</svg>
