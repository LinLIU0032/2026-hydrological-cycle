    <rect x="58" y="606" width="316" height="32" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/>
    <text x="74" y="627" font-size="13" font-weight="bold" fill="#1E4FA8">Reservoirs 储库</text>
    <text x="204" y="627" font-size="13" fill="#4A5568">→</text>
    <text x="232" y="627" font-size="13" font-weight="bold" fill="#0E3F8C">Fluxes 通量</text>
  </g>

  <g id="reading-step-1" data-pptx-bounds="914 154 326 142">
