    <text x="990" y="190" font-size="16" font-weight="bold" fill="#0E3F8C">找储库 | Reservoirs</text>
    <text x="940" y="236" font-size="15" fill="#1A2230">
      <tspan x="940" dy="0">海洋、大气、冰雪、陆地生命</tspan>
      <tspan x="940" dy="24">与地下水共同构成储存空间。</tspan>
    </text>
  </g>

  <g id="reading-step-2" data-pptx-bounds="914 308 326 142">
    <rect x="914" y="308" width="326" height="142" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="1"/>
    <circle cx="954" cy="348" r="22" fill="#3D7BD9"/>
