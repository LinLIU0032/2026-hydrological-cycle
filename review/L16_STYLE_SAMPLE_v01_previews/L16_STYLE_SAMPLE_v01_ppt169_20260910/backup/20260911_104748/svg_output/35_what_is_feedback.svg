<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-role="header" data-pptx-bounds="0 0 1280 72">
    <rect x="0" y="0" width="1280" height="72" fill="#0E3F8C"/>
    <text x="40" y="45" font-size="18" font-weight="bold" fill="#FFFFFF">3.1 什么是反馈？ | What Is Feedback?</text>
    <text x="1240" y="45" font-size="16" text-anchor="end" fill="#C7D7F2">FEEDBACKS</text>
  </g>

  <g id="teaching-message" data-pptx-bounds="40 92 1200 48">
    <rect x="40" y="96" width="6" height="28" rx="3" fill="#EA580C"/>
    <text x="58" y="119" font-size="21" font-weight="bold" fill="#1A2230">positive / negative 描述作用方向，不是“好”或“坏”</text>
  </g>

  <g id="shared-start" data-pptx-bounds="478 152 324 76">
    <rect x="478" y="152" width="324" height="76" rx="12" fill="#F7F9FC" stroke="#D6DCE5" stroke-width="2"/>
    <text x="640" y="183" font-size="16" font-weight="bold" text-anchor="middle" fill="#0E3F8C">初始变化 | Initial change</text>
    <text x="640" y="210" font-size="15" text-anchor="middle" fill="#4A5568">先明确变化的方向，再判断回路效果</text>
    <g id="branch-arrows" data-pptx-role="decoration">
    <line x1="548" y1="228" x2="348" y2="270" stroke="#EA580C" stroke-width="3"/>
    <polygon points="353,260 338,272 357,276" fill="#EA580C"/>
    <line x1="732" y1="228" x2="932" y2="270" stroke="#1E4FA8" stroke-width="3"/>
    <polygon points="923,260 942,272 927,276" fill="#1E4FA8"/>
    </g>
  </g>

  <g id="positive-loop" data-pptx-bounds="40 252 568 352">
    <rect x="40" y="252" width="568" height="352" rx="12" fill="#FDF4EF" stroke="#F0CFC2" stroke-width="2"/>
    <circle cx="86" cy="298" r="24" fill="#EA580C"/>
    <text x="86" y="307" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">+</text>
    <text x="124" y="292" font-size="19" font-weight="bold" fill="#C2410C">正反馈 | Positive feedback</text>
    <text x="124" y="320" font-size="15" fill="#7A4A33">诱发变化与初始变化同向</text>

    <rect x="86" y="364" width="190" height="76" rx="12" fill="#FFFFFF" stroke="#F0CFC2"/>
    <text x="181" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#C2410C">诱发变化</text>
    <text x="181" y="421" font-size="13" text-anchor="middle" fill="#4A5568">Induced change</text>
    <rect x="372" y="364" width="190" height="76" rx="12" fill="#EA580C"/>
    <text x="467" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">放大 / 加强</text>
    <text x="467" y="421" font-size="13" text-anchor="middle" fill="#FFFFFF">Amplifies / reinforces</text>
    <line x1="276" y1="402" x2="362" y2="402" stroke="#EA580C" stroke-width="5"/>
    <polygon points="350,391 369,402 350,413" fill="#EA580C"/>
    <path d="M467 440 C467 522 181 522 181 450" fill="none" stroke="#EA580C" stroke-width="4"/>
    <polygon points="170,462 181,443 192,462" fill="#EA580C"/>
    <rect x="126" y="524" width="396" height="50" rx="10" fill="#FDECDD"/>
    <text x="324" y="556" font-size="16" font-weight="bold" text-anchor="middle" fill="#C2410C">最终作用：沿原方向继续推进</text>
  </g>

  <g id="negative-loop" data-pptx-bounds="672 252 568 352">
    <rect x="672" y="252" width="568" height="352" rx="12" fill="#F0F5FC" stroke="#B8C7DC" stroke-width="2"/>
    <circle cx="718" cy="298" r="24" fill="#1E4FA8"/>
    <text x="718" y="305" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">−</text>
    <text x="756" y="292" font-size="19" font-weight="bold" fill="#0E3F8C">负反馈 | Negative feedback</text>
    <text x="756" y="320" font-size="15" fill="#4A5568">诱发作用反对初始变化</text>

    <rect x="718" y="364" width="190" height="76" rx="12" fill="#FFFFFF" stroke="#B8C7DC"/>
    <text x="813" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#0E3F8C">诱发变化</text>
    <text x="813" y="421" font-size="13" text-anchor="middle" fill="#4A5568">Induced change</text>
    <rect x="1004" y="364" width="190" height="76" rx="12" fill="#1E4FA8"/>
    <text x="1099" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">抑制 / 稳定</text>
    <text x="1099" y="421" font-size="13" text-anchor="middle" fill="#FFFFFF">Opposes / stabilizes</text>
    <line x1="908" y1="402" x2="994" y2="402" stroke="#1E4FA8" stroke-width="5"/>
    <polygon points="982,391 1001,402 982,413" fill="#1E4FA8"/>
    <path d="M1099 440 C1099 522 813 522 813 450" fill="none" stroke="#1E4FA8" stroke-width="4"/>
    <polygon points="802,462 813,443 824,462" fill="#1E4FA8"/>
    <rect x="758" y="524" width="396" height="50" rx="10" fill="#DCEAF8"/>
    <text x="956" y="556" font-size="16" font-weight="bold" text-anchor="middle" fill="#0E3F8C">最终作用：把系统拉回原状态附近</text>
  </g>

  <g id="decision-strip" data-pptx-bounds="144 620 992 46">
    <text x="144" y="650" font-size="15" font-weight="bold" fill="#1A2230">判断步骤</text>
    <text x="238" y="650" font-size="15" fill="#4A5568">找初始变化</text>
    <text x="350" y="650" font-size="15" fill="#EA580C">→</text>
    <text x="384" y="650" font-size="15" fill="#4A5568">跟踪诱发变化</text>
    <text x="526" y="650" font-size="15" fill="#EA580C">→</text>
    <text x="560" y="650" font-size="15" fill="#4A5568">比较最终作用方向</text>
    <text x="742" y="650" font-size="15" fill="#EA580C">→</text>
    <text x="776" y="650" font-size="15" font-weight="bold" fill="#0E3F8C">同向 = 正；反向 = 负</text>
  </g>

  <text id="source" data-pptx-role="footer" x="40" y="696" font-size="12" fill="#4A5568">Source/redraw basis: UE 8e, Ch.12, PDF pp.1177–1178; EP Ch.23 (M-11).</text>
  <text id="page-number" data-pptx-role="page-number" x="1240" y="696" font-size="12" text-anchor="end" fill="#4A5568">35</text>
</svg>
